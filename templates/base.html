<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlmoxIF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar {
            min-height: 100vh;
            background-color: #1e3a5f;
            padding-top: 20px;
        }
        .sidebar a {
            color: #cdd9e5;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
            font-size: 15px;
        }
        .sidebar a:hover {
            background-color: #2e5f9e;
            color: white;
        }
        .sidebar .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 20px 30px 20px;
            border-bottom: 1px solid #2e5f9e;
            margin-bottom: 10px;
        }
        .conteudo { padding: 30px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Menu lateral -->
        <div class="col-md-2 sidebar">
            <div class="logo"><i class="bi bi-box-seam"></i> AlmoxIF</div>
            <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="/produtos"><i class="bi bi-archive"></i> Produtos</a>
            <a href="/fornecedores"><i class="bi bi-truck"></i> Fornecedores</a>
            <a href="/movimentacoes"><i class="bi bi-arrow-left-right"></i> Movimentações</a>
            <a href="/relatorios"><i class="bi bi-bar-chart"></i> Relatórios</a>
        </div>

        <!-- Conteúdo principal -->
        <div class="col-md-10 conteudo">
            {% block conteudo %}{% endblock %}
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
