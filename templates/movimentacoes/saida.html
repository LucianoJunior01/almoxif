{% extends 'base.html' %}
{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-arrow-up-circle text-warning"></i> Nova Saída</h2>
    <a href="/movimentacoes" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Produto *</label>
                    <select name="produto_id" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for p in produtos %}
                        <option value="{{ p['id'] }}">
                            {{ p['nome'] }} (Estoque: {{ p['estoque_atual'] }} {{ p['unidade'] }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quantidade *</label>
                    <input type="number" step="0.01" name="quantidade" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Data *</label>
                    <input type="date" name="data" class="form-control" value="{{ hoje }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Responsável</label>
                    <input type="text" name="responsavel" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Motivo</label>
                    <input type="text" name="motivo" class="form-control" placeholder="Ex: Consumo interno, Transferência...">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-check-circle"></i> Registrar Saída
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
