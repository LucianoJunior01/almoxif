{% extends 'base.html' %}
{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Novo Produto</h2>
    <a href="/produtos" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome do Produto *</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Código *</label>
                    <input type="text" name="codigo" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Categoria</label>
                    <input type="text" name="categoria" class="form-control" placeholder="Ex: Elétrico, EPI...">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Unidade</label>
                    <select name="unidade" class="form-select">
                        <option>un</option>
                        <option>kg</option>
                        <option>m</option>
                        <option>cx</option>
                        <option>L</option>
                        <option>par</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Estoque Atual</label>
                    <input type="number" step="0.01" name="estoque_atual" class="form-control" value="0">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Estoque Mínimo</label>
                    <input type="number" step="0.01" name="estoque_minimo" class="form-control" value="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Preço Médio (R$)</label>
                    <input type="number" step="0.01" name="preco_medio" class="form-control" value="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Origem</label>
                    <select name="nacional" class="form-select" id="selectOrigem" onchange="toggleImportado()">
                        <option value="S">Nacional</option>
                        <option value="N">Importado</option>
                    </select>
                </div>

                <!-- Campos que aparecem só se for importado -->
                <div class="col-md-3" id="camposPais" style="display:none">
                    <label class="form-label">País de Origem</label>
                    <input type="text" name="pais_origem" class="form-control" placeholder="Ex: China, EUA...">
                </div>
                <div class="col-md-2" id="camposLead" style="display:none">
                    <label class="form-label">Lead Time (dias)</label>
                    <input type="number" name="lead_time_dias" class="form-control" value="0">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Salvar Produto
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
function toggleImportado() {
    const origem = document.getElementById('selectOrigem').value;
    const mostrar = origem === 'N';
    document.getElementById('camposPais').style.display = mostrar ? 'block' : 'none';
    document.getElementById('camposLead').style.display = mostrar ? 'block' : 'none';
}
</script>

{% endblock %}
